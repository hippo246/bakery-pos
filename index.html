      body {
        margin: 0;
        padding: 0;
        background: #0C0A08;
        color: #F0EBE3;
      }
      #root {
        min-height: 100vh;
      }
      
      @media print {
        @page {
          size: 80mm auto;
          margin: 0;
        }
        body * {
          visibility: hidden;
        }
        .thermal-receipt, .thermal-receipt * {
          visibility: visible;
        }
        .thermal-receipt {
          position: absolute;
          left: 0;
          top: 0;
          width: 80mm;
          padding: 5mm;
          font-family: 'Courier New', monospace;
          font-size: 12px;
          color: black;
          background: white;
        }
        .thermal-receipt {
          display: block !important;
        }
      }
      
      .thermal-receipt {
        display: none;
      }
    </style>
